name: Notify Devel Package

on:
  push:
    branches: [ calamares ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            https://api.github.com/repos/endeavouros-team/calamares-devel-package/dispatches \
            -d '{"event_type":"calamares-changed"}'
