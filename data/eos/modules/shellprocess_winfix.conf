#
# shellprocess_winfix.conf
# to enable little fixes inside install process
# add a generic windows config to systemd-boot
# workaraound for the issue to boot windows from another drive
# added on 6. nov 2025 by joekamprad

---

dontChroot: true

# Enable detailed logging for better debugging.
verbose: true

script:
 - "[ -d "${ROOT}/efi/EFI/Microsoft" ] && cp /etc/calamares/files/winfix.conf "${ROOT}/efi/loader/entries/""

i18n:
 name: "Apply minor fixes"
 name[de]: "Wende kleinere Korrekturen an"
 name[fi]: "Käytä pieniä korjauksia"
 name[fr]: "Appliquer des correctifs mineurs"
 name[it]: "Applicare correzioni minori"
 name[es]: "Aplicar correcciones menores"
 name[ru]: "Применение незначительных исправлений"
 name[zh_CN]: "应用小修正"
 name[ja]: "マイナーな修正を適用する"
 name[sv]: "Tillämpa mindre korrigeringar"
 name[pt_BR]: "Aplicar correções menores"
 name[tr]: "Küçük düzeltmeleri uygula"
 name[ro]: "Aplică corecții minore"
 name[ko]: "작은 수정사항 적용 중"